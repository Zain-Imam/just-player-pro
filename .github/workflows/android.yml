# Every push and every pull request: does it build, and do the tests pass.
#
# It used to watch `master`, which this repository does not have, so it had
# never once run. It also used `./gradlew build`, which builds every variant and
# runs lint over all of them for no benefit here -- one release APK and the unit
# tests answer the same question in a fraction of the time.
name: Build and test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # 21, not 17. The libmpv aar is compiled with Java 21, so its class files
      # are version 65 and a javac 17 refuses to read them:
      #   bad class file: .../MPVLib.class
      #   class file has wrong version 65.0, should be 61.0
      # The app still targets Java 11 bytecode; this is only the JDK doing the
      # compiling, and it matches the Temurin 21 the project is built with.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Validate the Gradle wrapper
        uses: gradle/actions/wrapper-validation@v5

      # Media3LinkageTest is the one that matters most here: it reads every
      # class file in the patched aars and resolves every call between them, so
      # a Maven version raised past the aars fails the build instead of failing
      # on somebody's television.
      - name: Unit tests
        run: ./gradlew --no-daemon :app:testLatestUniversalDebugUnitTest

      - name: Build
        run: ./gradlew --no-daemon :app:assembleLatestUniversalRelease

      - name: Keep the test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: app/build/reports/tests/
          if-no-files-found: ignore
