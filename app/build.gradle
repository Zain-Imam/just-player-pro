plugins {
    id 'com.android.application'
}

// release signing; without keystore.properties the debug key is used
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("keystore.properties")
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

// Trakt and Simkl app ids from .env (NAME:value lines), never from git; missing ones leave
// that service switched off in the build
def envValues = [:]
def envFile = rootProject.file(".env")
if (envFile.exists()) {
    envFile.eachLine { line ->
        def m = line =~ /^([A-Z0-9_]+)[:=](.*)$/
        if (m.find()) {
            envValues[m.group(1)] = m.group(2).trim()
        }
    }
}
def envField = { String name -> "\"" + (envValues[name] ?: "").replace("\"", "") + "\"" }

android {
    namespace 'com.brouken.player'
    compileSdk = 36
    ndkVersion '29.0.14206865'

    signingConfigs {
        debug {
            storeFile = rootProject.file("debug.keystore")
            storePassword = "android"
            keyAlias = "androiddebugkey"
            keyPassword = "android"
        }
        if (keystorePropertiesFile.exists()) {
            release {
                storeFile = rootProject.file(keystoreProperties['storeFile'])
                storePassword = keystoreProperties['storePassword']
                keyAlias = keystoreProperties['keyAlias']
                keyPassword = keystoreProperties['keyPassword']
            }
        }
    }

    defaultConfig {
        def abiFilter = project.findProperty("abiFilter")
        applicationId "app.justplayerpro.android"
        minSdkVersion 25
        targetSdkVersion 36
        versionCode 8
        versionName "5.1.0"
        buildConfigField "String", "TRAKT_CLIENT_ID", envField("TRAKT_CLIENT_ID")
        buildConfigField "String", "TRAKT_CLIENT_SECRET", envField("TRAKT_CLIENT_SECRET")
        buildConfigField "String", "SIMKL_CLIENT_ID", envField("SIMKL_CLIENT_ID")
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        if (abiFilter) {
            def abiCodeMap = ["x86": 1, "x86_64": 2, "armeabi-v7a": 3, "arm64-v8a": 4]
            versionCode = versionCode * 10 + abiCodeMap[abiFilter]
            ndk {
                abiFilters abiFilter
            }
        }
    }
    base {
        archivesName = "just_player_pro"
    }
    buildTypes {
        debug {
            applicationIdSuffix = ".debug"
            // en-XA stretches every text, ar-XB mirrors it: layout tests for translations
            pseudoLocalesEnabled true
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig = keystorePropertiesFile.exists() ? signingConfigs.release : signingConfigs.debug
        }
    }
    flavorDimensions "targetSdk", "distribution"
    productFlavors {
        latest {
            dimension "targetSdk"
        }
        /*legacy {
            dimension "targetSdk"
            versionCode = defaultConfig.versionCode + 1_000_000
            versionNameSuffix "-legacy"
            targetSdkVersion 29
        }*/

        universal {
            dimension "distribution"
        }
        /*amazon {
            dimension "distribution"
        }
        accrescent {
            dimension "distribution"
        }*/
    }
    variantFilter { variant ->
        def names = variant.flavors*.name
        if (names.contains("legacy") && (names.contains("amazon") || names.contains("accrescent"))) {
            setIgnore(true)
        }
    }
    applicationVariants.all { variant ->
        if (variant.buildType.name == "release" && variant.flavorName == "latestUniversal") {
            variant.outputs.all { output ->
                output.outputFileName = "${base.archivesName.get()}.apk"
            }
        }
        if (variant.buildType.name == "release" && variant.flavorName == "legacyUniversal") {
            variant.outputs.all { output ->
                output.outputFileName = "${base.archivesName.get()}-legacy.apk"
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    buildFeatures {
        buildConfig = true
    }
    // one corpus for unit and device tests, since the two runtimes can disagree
    sourceSets {
        test.java.srcDirs += 'src/sharedTest/java'
        androidTest.java.srcDirs += 'src/sharedTest/java'
        // licence notices ship inside the APK, generated from licenses/
        main.assets.srcDirs += "${buildDir}/generated/licenses"
    }

    lint {
        disable 'MissingTranslation'
        disable 'UnsafeOptInUsageError'
    }

    // unpacked at install: Android only runs programs from there (the yt-dlp starters)
    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }
    sourceSets.main.jniLibs.srcDirs += "${buildDir}/generated/starters"
}

// The yt-dlp starters are programs, which externalNativeBuild does not package, so they are
// compiled here. Named lib*.so so the installer unpacks them with the libraries.
def starterAbis = [
        'arm64-v8a'  : 'aarch64-linux-android',
        'armeabi-v7a': 'armv7a-linux-androideabi',
        'x86'        : 'i686-linux-android',
        'x86_64'     : 'x86_64-linux-android',
]
def starters = [
        'libytdl.so': ['JPP_PYTHON_LIB', 'Py_BytesMain'],
        'libqjs.so' : ['JPP_QJS_LIB', 'qjs_main'],
]
def starterTasks = []
starterAbis.each { abi, triple ->
    starters.each { name, entry ->
        starterTasks << tasks.register("starter_${abi}_${name - '.so'}", Exec) {
            def source = file('src/main/cpp/starter.c')
            def out = file("${buildDir}/generated/starters/${abi}/${name}")
            inputs.file source
            outputs.file out
            doFirst { out.parentFile.mkdirs() }
            def windows = org.gradle.internal.os.OperatingSystem.current().windows
            def host = windows ? 'windows-x86_64'
                    : org.gradle.internal.os.OperatingSystem.current().macOsX ? 'darwin-x86_64' : 'linux-x86_64'
            commandLine "${android.ndkDirectory}/toolchains/llvm/prebuilt/${host}/bin/clang${windows ? '.exe' : ''}",
                    "--target=${triple}25", '-O2', '-s', '-Wall',
                    "-DLIBRARY_ENV=${entry[0]}", "-DENTRY=${entry[1]}", '-o', out, source
        }
    }
}
tasks.configureEach { task ->
    if (task.name ==~ /merge.*JniLibFolders/) {
        task.dependsOn starterTasks
    }
}

dependencies {
    // must match the patched aars in libs/
    def media3_version = '1.10.0'
    def androidxCoreVersion = '1.8.0'
    implementation "androidx.media3:media3-session:$media3_version"
    implementation "androidx.media3:media3-datasource:$media3_version"
    implementation "androidx.media3:media3-decoder:$media3_version"
    implementation "androidx.media3:media3-common:$media3_version"
    implementation "androidx.media3:media3-container:$media3_version"
    implementation "androidx.media3:media3-extractor:$media3_version"
    // ExoPlayer itself is the patched aar in libs/. These modules must be the same
    // version or HLS/DASH fail at runtime with NoSuchMethodError.
    implementation("androidx.media3:media3-exoplayer-dash:$media3_version") {
        exclude group: "androidx.media3", module: "media3-exoplayer"
    }
    // HLS is lib-exoplayer-hls-release.aar in libs/: 1.10.0 with 1.10.1's fix for a crash on any
    // failed playlist or segment load when not every variant is selected (androidx/media#3161)
    implementation("androidx.media3:media3-exoplayer-smoothstreaming:$media3_version") {
        exclude group: "androidx.media3", module: "media3-exoplayer"
    }
    implementation("androidx.media3:media3-exoplayer-rtsp:$media3_version") {
        exclude group: "androidx.media3", module: "media3-exoplayer"
    }
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'com.getkeepsafe.taptargetview:taptargetview:1.13.3'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.coordinatorlayout:coordinatorlayout:1.3.0'
    implementation "androidx.core:core:$androidxCoreVersion"
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.preference:preference:1.2.1'
    // libmpv for the mpv engine; adds about 25 MB per ABI
    implementation 'dev.jdtech.mpv:libmpv:1.0.0'
    implementation 'com.squareup.okhttp3:okhttp:5.3.2'
    implementation 'com.sigpwned:chardet4j:78.1.0'
    // QR encoder, to get error reports off a TV
    implementation 'com.google.zxing:core:3.5.3'
    // device tests catch ICU regex differences that desktop Java misses
    testImplementation 'junit:junit:4.13.2'
    // real org.json; Android's is a stub in unit tests
    testImplementation 'org.json:json:20231013'
    androidTestImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:rules:1.6.1'

    implementation project(path: ':doubletapplayerview')
    implementation project(path: ':android-file-chooser')
    implementation fileTree(dir: "libs", include: ["lib-*.aar"])
}

// copies licenses/ into assets, plus an index.txt of "title|file" lines
def licenseAssets = tasks.register('licenseAssets', Copy) {
    def out = layout.buildDirectory.dir('generated/licenses/licenses')
    from(rootProject.file('licenses')) {
        include '*.txt'
    }
    from(rootProject.file('LICENSE')) {
        rename { 'GPL-3.0.txt' }
    }
    from(rootProject.file('THIRD-PARTY-NOTICES.md'))
    into out

    doLast {
        def dir = out.get().asFile
        def titles = [
                'GPL-3.0.txt'                              : 'Just Player Pro (GNU GPL v3)',
                'THIRD-PARTY-NOTICES.md'                   : 'Third-party notices',
                'Apache-2.0.txt'                           : 'Apache License 2.0',
                'Apache-2.0-with-LLVM-exception-libcxx.txt': 'Apache 2.0 with LLVM exception (libc++)',
                'GPL-2.0.txt'                              : 'GNU GPL v2 (mpv, FFmpeg)',
                'LGPL-2.1.txt'                             : 'GNU LGPL v2.1 (FFmpeg)',
                'ISC-libass.txt'                           : 'ISC (libass)',
                'MIT-DoubleTapPlayerView.txt'              : 'MIT (DoubleTapPlayerView)',
                'MIT-libmpv-android.txt'                   : 'MIT (libmpv-android)',
        ]
        def lines = []
        titles.each { file, title ->
            if (new File(dir, file).exists()) {
                lines << "${title}|${file}"
            }
        }
        dir.listFiles().sort { it.name }.each { f ->
            if (f.name != 'index.txt' && !titles.containsKey(f.name)) {
                lines << "${f.name - ~/\.(txt|md)$/}|${f.name}"
            }
        }
        new File(dir, 'index.txt').text = lines.join('\n') + '\n'
    }
}

// lint tasks read the asset dirs too and fail the build without this dependency
tasks.configureEach { task ->
    if (task.name == 'licenseAssets') {
        return
    }
    if (task.name.contains('Assets') || task.name.toLowerCase().contains('lint')) {
        task.dependsOn licenseAssets
    }
}
